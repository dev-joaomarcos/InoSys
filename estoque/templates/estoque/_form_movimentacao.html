<form id="form-movimentacao" novalidate
      hx-post="/estoque/movimentacoes/nova/"
      hx-target="#modal-movimentacao .modal-content" hx-swap="innerHTML">
  <div class="modal-header">
    <h2 class="modal-title" id="modal-movimentacao-titulo">Registrar movimentação</h2>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
  </div>
  <div class="modal-body">
    <div class="is-swap-error alert alert-danger" role="alert">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>
    <fieldset class="mb-3">
      <legend class="form-label is-required">Tipo</legend>
      <div class="btn-group w-100" role="group">
        <input class="btn-check" type="radio" name="tipo" id="tipo-entrada" value="entrada" required{% if v.tipo != "saida" %} checked{% endif %}>
        <label class="btn btn-outline-primary" for="tipo-entrada"><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i> Entrada</label>
        <input class="btn-check" type="radio" name="tipo" id="tipo-saida" value="saida"{% if v.tipo == "saida" %} checked{% endif %}>
        <label class="btn btn-outline-primary" for="tipo-saida"><i class="bi bi-box-arrow-up" aria-hidden="true"></i> Saída</label>
      </div>
    </fieldset>
    <div class="mb-3">
      <label class="form-label is-required" for="mov-material">Material</label>
      <select class="form-select{% if form.material.errors %} is-invalid{% endif %}" id="mov-material" name="material" required aria-describedby="mov-saldo">
        <option value="">Selecione…</option>
        {% for m in materiais %}<option value="{{ m.pk }}" data-saldo="{{ m.qtd_atual }}" data-unidade="{{ m.unidade_medida }}"{% if v.material == m.pk|stringformat:"s" %} selected{% endif %}>{{ m.nome }}</option>{% endfor %}
      </select>
      <div class="form-text" id="mov-saldo">Saldo atual: <span class="is-metric" data-campo="saldo">—</span></div>
      <div class="invalid-feedback">{{ form.material.errors.0 }}</div>
    </div>
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label is-required" for="mov-quantidade">Quantidade</label>
        <input class="form-control{% if form.quantidade.errors %} is-invalid{% endif %}" type="number" id="mov-quantidade" name="quantidade" min="1" step="1" inputmode="numeric" value="{{ v.quantidade }}" required>
        <div class="invalid-feedback" id="mov-quantidade-erro">{{ form.quantidade.errors.0 }}</div>
      </div>
      <div class="col-sm-6">
        <label class="form-label is-required" for="mov-data">Data</label>
        <input class="form-control{% if form.data.errors %} is-invalid{% endif %}" type="date" id="mov-data" name="data" value="{{ v.data }}" required>
        <div class="invalid-feedback">{{ form.data.errors.0 }}</div>
      </div>
    </div>
    <div class="mt-3" id="grupo-motivo"{% if v.tipo != "saida" %} hidden{% endif %}>
      <label class="form-label is-required" for="mov-motivo">Motivo da saída</label>
      <select class="form-select{% if form.motivo.errors %} is-invalid{% endif %}" id="mov-motivo" name="motivo">
        <option value="">Selecione…</option>
        {% for valor, rotulo in motivos %}<option value="{{ valor }}"{% if v.motivo == valor %} selected{% endif %}>{{ rotulo }}</option>{% endfor %}
      </select>
      <div class="invalid-feedback">{{ form.motivo.errors.0 }}</div>
    </div>
    <div class="is-calculo mt-3">
      <span class="is-calculo-rotulo">Saldo depois do registro</span>
      <span class="is-calculo-valor" data-campo="saldo_depois">—</span>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-primary">Registrar</button>
  </div>
</form>
