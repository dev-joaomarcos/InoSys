<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 44" role="img" aria-label="InoSys">
  <!-- Logo completo do InoSys (ícone + nome) para uso fora das páginas, como documentos e slides.
       Nas páginas, prefira a versão inline do templates/landing.html, que segue o tema. -->
  <rect x="2" y="2" width="44" height="30" rx="6" fill="#002dff"/>
  <rect x="6.5" y="6.5" width="35" height="21" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="12,23 19.5,15.5 25,20.5 35,11"/>
    <polyline points="29,11 35,11 35,17"/>
  </g>
  <rect x="21" y="31" width="6" height="6" fill="#002dff"/>
  <rect x="13" y="36" width="22" height="5.5" rx="2.75" fill="#002dff"/>
  <text x="58" y="33" fill="#0b1330" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5">InoSys</text>
</svg>
