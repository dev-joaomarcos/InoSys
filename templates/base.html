{% load static %}<!doctype html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InoSys{% endblock %}</title>

  {# Aplica o tema salvo antes de pintar a página, para não piscar. #}
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('inosys-tema'); } catch (e) {}
      if (!tema) {
        tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', tema);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  {# O tema do InoSys vem sempre depois do Bootstrap. #}
  <link rel="stylesheet" href="{% static 'css/inosys.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script>
    // Alterna entre tema claro e escuro em qualquer botão [data-ino-theme-toggle].
    document.querySelectorAll('[data-ino-theme-toggle]').forEach(function (botao) {
      botao.addEventListener('click', function () {
        var raiz = document.documentElement;
        var novo = raiz.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        raiz.setAttribute('data-bs-theme', novo);
        try { localStorage.setItem('inosys-tema', novo); } catch (e) {}
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
