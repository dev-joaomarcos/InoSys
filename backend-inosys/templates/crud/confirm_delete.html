{% extends "base.html" %}
{% block conteudo %}
<div class="card mx-auto max-w-xl">
  <h2 class="mb-2 text-xl font-extrabold">Excluir “{{ object }}”?</h2>
  <p class="mb-4">Esta ação não pode ser desfeita. {{ aviso }}</p>
  <form method="post">{% csrf_token %}
    <div class="flex justify-end gap-2">
      <a href="{{ voltar }}" class="btn">Cancelar</a>
      <button class="btn btn-del">Excluir</button>
    </div>
  </form>
</div>
{% endblock %}
