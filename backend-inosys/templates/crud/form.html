{% extends "base.html" %}
{% block conteudo %}
<div class="card mx-auto max-w-xl">
  <h2 class="mb-4 text-xl font-extrabold">{{ titulo }}</h2>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    {% for campo in form %}
    <div class="mb-4">
      <label for="{{ campo.id_for_label }}" class="mb-1 block text-sm font-semibold mute">{{ campo.label }}</label>
      {{ campo }}
      {% if campo.help_text %}<p class="mt-1 text-sm mute">{{ campo.help_text }}</p>{% endif %}
      {% for erro in campo.errors %}<p class="mt-1 text-sm font-semibold text-red-700 dark:text-red-300">{{ erro }}</p>{% endfor %}
    </div>
    {% endfor %}
    <div class="flex justify-end gap-2">
      <a href="{{ voltar }}" class="btn">Cancelar</a>
      <button class="btn btn-pri">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
